# Sampling diagnostic: success confirms capture, not the benchmark assertion.
# The diagnostic branch pauses the test before its first tap to attach the sampler.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  XCODE_VERSION: ${{ vars.BLAU_CI_XCODE_VERSION }}
  SIMULATOR_NAME: ${{ vars.BLAU_CI_SIMULATOR || 'iPhone 17' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  NSUnbufferedIO: "YES"
defaults:
  run:
    shell: bash
jobs:
  topic-expansion-diagnostic:
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: make generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh
      - name: Build
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO"
        run: make build-tests
      - name: Warm up simulator
        timeout-minutes: 15
        continue-on-error: true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app
      - name: Sample the cold expansion
        timeout-minutes: 8
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p .build/results
          (
            for i in $(seq 1 900); do
              if grep -q BLAU_SAMPLE_READY .build/results/profiled-expansion.log 2>/dev/null; then
                pid=$(pgrep -x Blau | head -1 || true)
                if [ -n "$pid" ]; then
                  sleep 4
                  date -u > .build/results/sample-start.txt
                  sample "$pid" 12 1 -mayDie -file .build/results/expansion.sample.txt > .build/results/sample.log 2>&1
                  exit $?
                fi
              fi
              sleep 0.2
            done
            exit 1
          ) &
          sample_pid=$!
          set +e
          xcodebuild test-without-building -project Blau.xcodeproj -scheme Blau -testPlan Blau -destination "$DESTINATION" -derivedDataPath .build/DerivedData -resultBundlePath .build/results/profiled-expansion.xcresult -only-testing:BlauUITests/TopicDetailUITests/testTappingExpandsWithinAHundredMilliseconds -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO XAI_DEV_API_KEY= > .build/results/profiled-expansion.log 2>&1
          test_status=$?
          wait "$sample_pid"
          sample_status=$?
          set -e
          echo "Diagnostic test status: $test_status; sampler status: $sample_status"
          test -s .build/results/expansion.sample.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topic-expansion-diagnostic
          path: .build/results/
          retention-days: 7
