# Temporary diagnostic branch only: the integration PR retains the full CI workflow.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  XCODE_VERSION: ${{ vars.BLAU_CI_XCODE_VERSION }}
  SIMULATOR_NAME: ${{ vars.BLAU_CI_SIMULATOR || 'iPhone 17' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  NSUnbufferedIO: "YES"
defaults:
  run:
    shell: bash
jobs:
  topic-expansion-diagnostic:
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        run: make generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh
      - name: Build
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO"
        run: make build-tests
      - name: Warm up simulator
        timeout-minutes: 15
        continue-on-error: true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app
      - name: Three cold expansion runs
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p .build/results
          xcodebuild test-without-building -project Blau.xcodeproj -scheme Blau -testPlan Blau -destination "$DESTINATION" -derivedDataPath .build/DerivedData -resultBundlePath .build/results/expansion.xcresult -only-testing:BlauUITests/TopicDetailUITests/testTappingExpandsWithinAHundredMilliseconds -test-iterations 3 -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO XAI_DEV_API_KEY= | tee .build/results/expansion.log
          xcrun xcresulttool get test-results summary --path .build/results/expansion.xcresult --format json > .build/results/expansion-summary.json
          python3 -c 'import json; r=json.load(open(".build/results/expansion-summary.json")); print(r); assert r["totalTestCount"] == 1 and r["failedTests"] == 0'
          python3 -c 'import re; s=open(".build/results/expansion.log").read(); n=len(re.findall(r"Test Case .*testTappingExpandsWithinAHundredMilliseconds.* passed", s)); print("Passed iterations:",n); assert n == 3'
      - name: Large-text action controls
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p .build/results
          xcodebuild test-without-building -project Blau.xcodeproj -scheme Blau -testPlan Blau -destination "$DESTINATION" -derivedDataPath .build/DerivedData -resultBundlePath .build/results/large-actions.xcresult -only-testing:BlauUITests/TopicDetailUITests/testActionsRemainReachableAtTheLargestTextSize -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO XAI_DEV_API_KEY=
          xcrun xcresulttool get test-results summary --path .build/results/large-actions.xcresult --format json > .build/results/large-actions-summary.json
          python3 -c 'import json; r=json.load(open(".build/results/large-actions-summary.json")); print(r); assert r["totalTestCount"] == 1 and r["failedTests"] == 0'
      - name: Profile an expansion failure
        if: failure()
        timeout-minutes: 10
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p .build/results
          app=.build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app
          binary="$app/Blau"
          if [ -f "$app/Blau.debug.dylib" ]; then binary="$app/Blau.debug.dylib"; fi
          xcrun dsymutil "$binary" -o .build/results/Blau.dSYM
          xcrun xctrace record --template 'Time Profiler' --instrument os_signpost --show-recording-options > .build/results/recording-options.json
          python3 -c 'import json; p=".build/results/recording-options.json"; x=json.load(open(p)); x["Time Profiler"].update(contextSwitchSampling=True, highFrequencySampling=True, recordWaitingThreads=True); x["os_signpost"]["dynamicTracingEnabledSubsystems"]=["com.joeblau.blau"]; json.dump(x, open(p,"w"))'
          (
            for i in $(seq 1 600); do
              pid=$(pgrep -x Blau | head -1 || true)
              if [ -n "$pid" ]; then
                xcrun xctrace record --template 'Time Profiler' --instrument os_signpost --device "$UDID" --attach "$pid" --time-limit 60s --no-prompt --recording-options .build/results/recording-options.json --output .build/results/expansion.trace > .build/results/profile.log 2>&1
                exit $?
              fi
              sleep 0.2
            done
            exit 1
          ) &
          profile_pid=$!
          set +e
          xcodebuild test-without-building -project Blau.xcodeproj -scheme Blau -testPlan Blau -destination "$DESTINATION" -derivedDataPath .build/DerivedData -resultBundlePath .build/results/profiled-expansion.xcresult -only-testing:BlauUITests/TopicDetailUITests/testTappingExpandsWithinAHundredMilliseconds -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO XAI_DEV_API_KEY= > .build/results/profiled-expansion.log 2>&1
          test_status=$?
          wait "$profile_pid"
          profile_status=$?
          set -e
          echo "Profiled test status: $test_status; trace status: $profile_status"
          if [ "$profile_status" -eq 0 ]; then
            xcrun xctrace symbolicate --input .build/results/expansion.trace --dsym .build/results/Blau.dSYM || true
            xcrun xctrace export --input .build/results/expansion.trace --toc --output .build/results/trace-toc.xml
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topic-expansion-diagnostic
          path: .build/results/
          retention-days: 7
