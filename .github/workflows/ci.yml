# CI for Blau: lint, BlauKit package tests, app tests and the BlauKit
# micro-benchmark gate on every pull request and every push to main, plus the
# nightly XCTest performance suite, long-session soak test, ASR evaluation and
# memory evaluation.
# See docs/ci.md.
#
# Secrets: none. Tests are hermetic and never call xAI, and this workflow
# uploads .xcresult bundles, inside which GitHub does not mask secrets. Never
# map secrets.XAI_DEV_API_KEY (or any other secret) into a job here; see
# docs/configuration.md#ci. scripts/tests/test-ci-scripts.sh enforces it.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables)
# override the defaults without a code change:
#   BLAU_CI_RUNNER         runner label (default xcode-27)
#   BLAU_CI_XCODE_VERSION  pin an Xcode, e.g. "27.2" (default: newest release on the image)
#   BLAU_CI_SIMULATOR      simulator model for app and perf tests (default "iPhone 17")
#   BLAU_CI_MEMORY_EVAL_READER          memory-eval answer reader (default auto)
#   BLAU_CI_MEMORY_EVAL_REQUIRE_ANSWERS 1 fails memory-eval when no reader can run
#   BLAU_CI_SOAK_MINUTES   nightly soak length in minutes of audio (default 20)
#   BLAU_CI_SOAK_LEAKS     0 skips the soak's leak readings (default 1)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    # Nightly on main: the full suite against the current runner image, plus perf.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      perf:
        description: Also run the performance suite
        type: boolean
        default: false
      record_baselines:
        description: Record new performance baselines instead of checking them (artifacts to commit)
        type: boolean
        default: false
      asr_eval:
        description: Also run the ASR evaluation (downloads the models)
        type: boolean
        default: false
      memory_eval:
        description: Also run the memory retrieval and answer evaluation
        type: boolean
        default: false
      soak:
        description: Also run the long-session soak test on the simulator
        type: boolean
        default: false
      soak_minutes:
        description: Soak length in minutes of audio (played at 10x)
        type: string
        default: "20"

permissions:
  contents: read

# A new push to a pull request cancels its in-flight run. Runs on main are not
# cancelled, so every merged commit gets a result; GitHub still drops a queued
# main run when a newer one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: ${{ vars.BLAU_CI_XCODE_VERSION }}
  SIMULATOR_NAME: ${{ vars.BLAU_CI_SIMULATOR || 'iPhone 17' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  # Stream xcodebuild output instead of buffering it.
  NSUnbufferedIO: "YES"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      # swift-format from the selected Xcode toolchain (CONTRIBUTING.md: "the
      # one in the CI Xcode wins").
      - name: swift-format lint
        run: |
          echo "swift-format: $(xcrun --find swift-format)"
          make lint

      - name: Script tests
        run: make test-scripts

  package-tests:
    name: package-tests
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      # The whole SwiftPM scratch directory: dependency clones, the FluidAudio
      # binary artifacts and FluidAudio's build products, which are the slow
      # part. The key changes with the toolchain or the dependency graph only,
      # so it is saved once per change. BlauKit's own sources always rebuild.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/BlauKit/.build
          key: kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Build
        working-directory: Packages/BlauKit
        run: swift build --build-tests

      - name: Test
        working-directory: Packages/BlauKit
        run: |
          mkdir -p ../../.build/results
          swift test --skip-build --xunit-output ../../.build/results/package-tests.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tests-results-${{ github.run_attempt }}
          path: .build/results/
          if-no-files-found: warn
          retention-days: 14

  # The app's tests on an iOS Simulator, split so each job stays well inside
  # its limit: the unit tests (BlauTests) in one job and the UI tests
  # (BlauUITests) dealt out over the app-ui-tests matrix. Together they are
  # the Blau scheme's Blau test plan, `make test`. app-tests below is the one
  # check that needs them all.
  app-unit-tests:
    name: app-unit-tests
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    # About 10 minutes: the build, booting the simulator and the unit tests.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      # Package clones and binary artifacts Xcode resolves into DerivedData.
      # Build products are not cached: a cold app build is about two minutes.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      # Resolve only; xcodebuild boots the device once the build is done.
      # Booting it up front starves the runner: the freshly booted simulator's
      # background work slowed xcodebuild's start-up and the build by minutes.
      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Parallel testing is off: it would clone the simulator per worker,
      # which costs more than it saves on a runner this size.
      - name: Test
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "-resultBundlePath .build/results/app-unit-tests.xcresult -parallel-testing-enabled NO"
        run: make test-unit

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Upload xcresult
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-unit-tests-xcresult-${{ github.run_attempt }}
          path: .build/results/app-unit-tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  # The UI tests, one slice per matrix job: scripts/ci/ui-test-shard.sh deals
  # the test methods out over strategy.job-total shards, so adding a shard is
  # adding a number to the list. All of BlauUITests in one job took about 46
  # minutes of testing; a third is about 15, plus the build and the boot.
  app-ui-tests:
    name: app-ui-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    strategy:
      # One failing shard does not cancel the others, so a run reports every
      # failing UI test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      UI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      - name: Test
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "-resultBundlePath .build/results/app-ui-tests.xcresult -parallel-testing-enabled NO"
        run: make test-ui UI_SHARD="$UI_SHARD"

      # A selection that matched no test would otherwise pass with nothing run.
      - name: Check the shard ran all its tests
        run: scripts/ci/ui-test-shard.sh --check "$UI_SHARD" .build/results/app-ui-tests.xcresult

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Upload xcresult
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-ui-tests-${{ matrix.shard }}-xcresult-${{ github.run_attempt }}
          path: .build/results/app-ui-tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  # The required check for the app's tests: green only when the unit tests
  # and every UI shard passed. It always runs, because a required check that
  # is skipped counts as passing; a failed or cancelled job fails it. It keeps
  # the name of the single job it replaced, so required checks still match.
  app-tests:
    name: app-tests
    needs: [app-unit-tests, app-ui-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every app test job
        env:
          UNIT_RESULT: ${{ needs.app-unit-tests.result }}
          UI_RESULT: ${{ needs.app-ui-tests.result }}
        run: |
          echo "app-unit-tests: $UNIT_RESULT"
          echo "app-ui-tests:   $UI_RESULT"
          if [ "$UNIT_RESULT" != success ] || [ "$UI_RESULT" != success ]; then
            echo "::error::The app's tests did not all pass."
            exit 1
          fi

  # BlauKit micro-benchmarks (#73): package-benchmark over the topic engine,
  # RRF and the int8 vector search on the macOS host, failing when an
  # instruction or allocation count is more than 10% above the committed
  # thresholds (Packages/BlauKitBenchmarks/Thresholds). Fast enough for every
  # pull request, so a regression is caught before it merges. With
  # record_baselines, uploads new thresholds to commit instead.
  perf-kit:
    name: perf-kit
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      # The benchmark package's scratch directory: clones (FluidAudio and
      # GRDB through BlauKit, package-benchmark) and build products.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/BlauKitBenchmarks/.build
          key: microbench-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKitBenchmarks/Package.swift', 'Packages/BlauKitBenchmarks/Package.resolved', 'Packages/BlauKit/Package.swift') }}
          restore-keys: |
            microbench-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Regression gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_baselines) }}
        env:
          MICROBENCH_OUTPUT: .build/results/microbench/check.txt
        run: make microbench-check

      - name: Record thresholds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_baselines }}
        run: |
          make microbench-baseline
          mkdir -p .build/results/microbench
          cp -R Packages/BlauKitBenchmarks/Thresholds .build/results/microbench/

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/microbench/check.txt ]; then
            {
              echo "## BlauKit micro-benchmarks"
              echo
              echo '```'
              grep -v '^\[' .build/results/microbench/check.txt | tail -n 60
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-kit-results-${{ github.run_attempt }}
          path: .build/results/microbench/
          if-no-files-found: warn
          retention-days: 30

  # Nightly (and on demand) XCTest performance suite (#73): the Blau-Perf
  # scheme in Release with the scripted session compiled in, then the
  # regression gate against BlauPerfTests/Baselines/ci-simulator.json (fails
  # on a metric more than its tolerance, 10% by default, worse). The report
  # goes on the run's summary page; the results are kept 90 days as the
  # history. With record_baselines, uploads a new baseline to commit instead.
  perf:
    name: perf
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.perf) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Writes .build/results/perf.xcresult (the Makefile's PERF_RESULT).
      # One retry: the runner's simulator sometimes crashes the test runner
      # before any test starts ("never finished bootstrapping"), which would
      # fail the night with nothing measured. A real failure fails twice.
      - name: Performance tests
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "-parallel-testing-enabled NO"
        run: |
          if ! make perf; then
            echo "::warning::The performance tests failed; retrying once."
            make perf
          fi

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Regression gate
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.record_baselines) }}
        run: make perf-check

      - name: Record baseline
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_baselines }}
        # The extracted results too, so several runs can be pooled into one
        # calibrated baseline (docs/performance.md, "Updating baselines").
        run: |
          make perf-baseline
          cp BlauPerfTests/Baselines/ci-simulator.json .build/results/
          scripts/perf/perf-gate.py extract --xcresult .build/results/perf.xcresult \
            --output .build/results/perf-results.json

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/perf-report.md ]; then
            cat .build/results/perf-report.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-results-${{ github.run_attempt }}
          path: |
            .build/results/perf.xcresult
            .build/results/perf-report.md
            .build/results/perf-results.json
            .build/results/ci-simulator.json
          if-no-files-found: warn
          retention-days: 90

  # Nightly (and on demand) long-session soak test (#76) at reduced length:
  # 20 minutes of mixed audio (the user, a TV, silence) at 10x through the
  # app's pipeline on the simulator, against a local fake realtime server.
  # Fails on memory growth, latency drift, dropped frames, a missed session
  # renewal, a stalled conversation or a topic count out of range, and on
  # leaked memory growing between the app's leak readings. The report goes on
  # the run's summary page and is kept 90 days. The full two hours run weekly
  # on a device (docs/soak.md).
  soak:
    name: soak
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Writes .build/results/soak (the Makefile's SOAK_OUTPUT).
      - name: Soak
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || vars.BLAU_CI_SOAK_MINUTES || '20' }}
          SOAK_LEAKS: ${{ vars.BLAU_CI_SOAK_LEAKS || '1' }}
          XCODEBUILD_FLAGS: "-parallel-testing-enabled NO"
        run: make soak SOAK_MINUTES="$SOAK_MINUTES"

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/soak/summary.md ]; then
            cat .build/results/soak/summary.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-results-${{ github.run_attempt }}
          path: .build/results/soak/
          if-no-files-found: warn
          retention-days: 90

  # Nightly (and on demand) ASR evaluation (#32): WER, first-partial and
  # end-of-utterance latency and RTF of every engine on the ASR fixtures with
  # the real models, failing on the regression gate in
  # docs/asr-eval/thresholds.json. The report is kept as an artifact (the
  # history) and shown on the run's summary page. The pinned models (~700 MB,
  # public on Hugging Face, no token) are cached by manifest. See
  # docs/asr-eval.md.
  asr-eval:
    name: asr-eval
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.asr_eval) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The fixture audio is in Git LFS.
          lfs: true

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      # The same cache as package-tests: the evaluation runs in the package's
      # debug build.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/BlauKit/.build
          key: kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/models
          key: asr-models-${{ hashFiles('Packages/BlauKit/Sources/BlauTranscription/Models/PinnedModelManifest.swift') }}

      - name: Evaluate
        env:
          ASR_EVAL_OUTPUT: .build/results/asr-eval
        run: make eval-asr

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/asr-eval/report.md ]; then
            cat .build/results/asr-eval/report.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asr-eval-report-${{ github.run_attempt }}
          path: .build/results/asr-eval/
          if-no-files-found: warn
          retention-days: 90

  # Nightly (and on demand) memory evaluation (#70): Recall@k and MRR of hybrid
  # retrieval on the memory eval set (text only, recorded vectors, no model
  # download), failing on the regression gate in docs/memory-eval/thresholds.json.
  # Answer accuracy (an LLM reader and judge) runs where Apple's on-device
  # model is available. Hosted macOS VMs usually lack it, so there the report
  # says the answers were skipped; set BLAU_CI_MEMORY_EVAL_REQUIRE_ANSWERS=1
  # for a runner with Apple Intelligence to make that a failure. See
  # docs/memory-eval.md.
  memory-eval:
    name: memory-eval
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.memory_eval) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      # The same cache as package-tests: the evaluation runs in the package's
      # debug build.
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/BlauKit/.build
          key: kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            kit-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Evaluate
        env:
          MEMORY_EVAL_OUTPUT: .build/results/memory-eval
          MEMORY_EVAL_READER: ${{ vars.BLAU_CI_MEMORY_EVAL_READER || 'auto' }}
          MEMORY_EVAL_REQUIRE_ANSWERS: ${{ vars.BLAU_CI_MEMORY_EVAL_REQUIRE_ANSWERS || '0' }}
        run: make eval-memory

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/memory-eval/report.md ]; then
            cat .build/results/memory-eval/report.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-eval-report-${{ github.run_attempt }}
          path: .build/results/memory-eval/
          if-no-files-found: warn
          retention-days: 90
