# XcodeGen spec for Blau. Generate the project with `make generate`
# (or `xcodegen generate`). The generated Blau.xcodeproj, Info.plist and
# entitlements are build artifacts and are never committed.
#
# Spec reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Blau

options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  minimumXcodeGenVersion: 2.42.0
  xcodeVersion: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

# Project-level xcconfig files: non-secret defaults plus the optional,
# gitignored Config/Secrets.xcconfig. See docs/configuration.md.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    # Swift 6 language mode with complete strict concurrency checking.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  # Business logic, one library per subsystem. See docs/architecture.md.
  BlauKit:
    path: Packages/BlauKit

targets:
  Blau:
    type: application
    platform: iOS
    sources:
      - path: Blau
    dependencies:
      - package: BlauKit
        products:
          - BlauCore
          - BlauTelemetry
          - BlauAudio
          - BlauPersistence
          - BlauTranscription
          - BlauVoiceID
          - BlauRealtime
          - BlauTopics
          - BlauMemory
      # The recording Live Activity (#26), embedded in the app.
      - target: BlauWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau
        PRODUCT_NAME: Blau
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Blau/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Blau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: >-
          Blau listens to your voice so it can transcribe what you say
          and hold a spoken conversation with you.
        # audio: an active .playAndRecord session keeps a conversation
        # running with the screen locked (#26, docs/background.md).
        # processing: the memory index rebuild's BGProcessingTask (#63,
        # docs/memory-indexer.md).
        UIBackgroundModes:
          - audio
          - remote-notification
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.joeblau.blau.memory-index
        # The lock-screen recording indicator (#26).
        NSSupportsLiveActivities: true
        # Branding (#82, docs/branding.md): the brand mark centered on the
        # system background, both from Assets.xcassets/Brand.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BrandMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape too: the main screen's bottom bar keeps Settings left
        # and Record right in either orientation (#40).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Build configuration from Config/*.xcconfig, read by AppConfig.
        BlauEnvironment: $(BLAU_ENVIRONMENT)
        BlauXAIAPIHost: $(XAI_API_HOST)
        BlauXAIRealtimeModel: $(XAI_REALTIME_MODEL)
        # Empty except in Debug with a key in Config/Secrets.xcconfig.
        BlauXAIDevAPIKey: $(BLAU_INFO_XAI_DEV_API_KEY)
        # YES only when the app is signed, i.e. carries the iCloud
        # entitlement. Unsigned simulator / CI builds (CODE_SIGNING_ALLOWED=NO)
        # stay local-only instead of crashing in CKContainer. See docs/sync.md.
        BlauCloudKitEnabled: $(CODE_SIGNING_ALLOWED)
    postBuildScripts:
      # Release only (BLAU_FORBID_EMBEDDED_SECRETS): fail if XAI_DEV_API_KEY
      # is set or an xAI key is found in the built executable or Info.plist.
      # showEnvVars: false keeps Xcode from printing every build setting,
      # XAI_DEV_API_KEY included, into the build log and .xcresult.
      - name: Check for embedded secrets
        script: /bin/sh "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_INPUT_FILE_1}" "${SCRIPT_INPUT_FILE_2}"
        inputFiles:
          - $(SRCROOT)/scripts/check-embedded-secrets.sh
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
        showEnvVars: false
    entitlements:
      path: Blau/Supporting/Blau.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.joeblau.blau
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development

  # The recording Live Activity on the lock screen and in the Dynamic
  # Island (#26, docs/background.md). Doesn't link BlauKit: it only renders
  # the activity; the app owns it and runs its Stop intent.
  BlauWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BlauWidgets
        excludes:
          - Supporting
      # Shared with the app: the activity's attributes and Stop intent.
      - path: Blau/LiveActivity/RecordingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau.widgets
        PRODUCT_NAME: BlauWidgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: BlauWidgets/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Blau
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BlauTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlauTests
    dependencies:
      - target: Blau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau.tests
        GENERATE_INFOPLIST_FILE: YES

  BlauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlauUITests
    dependencies:
      - target: Blau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blau

  # A UI-testing bundle (not a unit-test bundle) so it can drive launches and
  # use XCTApplicationLaunchMetric / XCTOSSignpostMetric.
  BlauPerfTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlauPerfTests
    dependencies:
      - target: Blau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau.perftests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Blau

  # On-device model benchmarks (#22, docs/benchmarks.md). Not hosted in the
  # app: it links BlauKit itself, so the app's dead-code stripping can't drop
  # the benchmark cases. Every test skips unless BLAU_DEVICE_TESTS=1.
  BlauBenchmarks:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlauBenchmarks
        excludes:
          - Assets
      # Optional, gitignored model and recording (see Assets/README.md).
      - path: BlauBenchmarks/Assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: BlauKit
        products:
          - BlauCore
          - BlauTelemetry
          - BlauAudio
          - BlauTranscription
          - BlauVoiceID
          - BlauTopics
          - BlauMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.blau.benchmarks
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Blau:
    build:
      targets:
        Blau: all
        BlauTests: [test]
        BlauUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Blau
      testPlans:
        - path: TestPlans/Blau.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Blau-Perf:
    build:
      targets:
        Blau: all
        BlauPerfTests: [test]
    run:
      config: Release
    test:
      # Measure the optimized build: perf numbers from Debug are meaningless.
      config: Release
      testPlans:
        - path: TestPlans/BlauPerf.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  # Model benchmarks on a physical iPhone: `make bench DEVICE=<udid>`.
  Blau-Benchmarks:
    build:
      targets:
        BlauBenchmarks: [test]
    test:
      # Optimized Swift (FluidAudio's decoders, BlauKit) like the shipping app.
      config: Release
      testPlans:
        - path: TestPlans/BlauBenchmarks.xctestplan
          defaultPlan: true
